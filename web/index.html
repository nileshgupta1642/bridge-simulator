<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Bridge Simulator</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main id="scene" class="scene">
    <div class="water"></div>

    <div class="road">
      <div class="center-line"></div>
    </div>

    <div class="bridge">
      <div class="bridge-rail bridge-rail-top"></div>
      <div class="bridge-road">
        <div class="bridge-center-line"></div>
      </div>
      <div class="bridge-rail bridge-rail-bottom"></div>
    </div>

    <div id="cars" class="cars"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
